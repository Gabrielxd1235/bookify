
name: Deploy BOOKIFY API to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/bookify-api-AutoDeployTrigger-eb62e8bd-ca45-4cf5-9c2a-d402dbd57258.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/gabrielxd1235/bookify-api:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BOOKIFYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKIFYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKIFYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Docker image to Azure
        run: |
          az containerapp update \
            --name bookify-api \
            --resource-group bookify-rg \
            --image ghcr.io/gabrielxd1235/bookify-api:${{ github.sha }}
