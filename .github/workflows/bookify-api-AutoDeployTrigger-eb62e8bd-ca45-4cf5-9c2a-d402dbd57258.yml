
name: Deploy BOOKIFY API to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/bookify-api-AutoDeployTrigger-eb62e8bd-ca45-4cf5-9c2a-d402dbd57258.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # 1. Nothing is deployed unless the backend tests pass
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_SECRET_KEY: ci-dummy-key
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test

  # 2. Build the image, roll out a new revision, then verify it is healthy
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/gabrielxd1235/bookify-api:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BOOKIFYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKIFYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKIFYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Docker image to Azure
        run: |
          az containerapp update \
            --name bookify-api \
            --resource-group bookify-rg \
            --image ghcr.io/gabrielxd1235/bookify-api:${{ github.sha }}

      # Smoke test: the new revision must answer /api/health/ready (API + DB)
      - name: Verify the deployed API is ready
        run: |
          URL="https://$(az containerapp show --name bookify-api --resource-group bookify-rg --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 18); do
            if curl -fsS --max-time 20 "$URL/api/health/ready"; then echo; echo "API ready"; exit 0; fi
            echo "Waiting for the new revision ($i/18)..."; sleep 10
          done
          echo "The new revision did not become ready" >&2
          exit 1
