
name: Deploy BOOKIFY API to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/bookify-api-AutoDeployTrigger-eb62e8bd-ca45-4cf5-9c2a-d402dbd57258.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy BOOKIFY backend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Microsoft Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BOOKIFYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BOOKIFYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BOOKIFYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy BOOKIFY API
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          containerAppName: bookify-api
          resourceGroup: bookify-rg
          targetPort: 3000
          disableTelemetry: true
